{% extends "welcome.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div style="display:flex; justify-content:center; align-items:center; height:80vh;">

    <div style="
        background:white;
        padding:30px;
        width:350px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
        text-align:center;
    ">

        <h2>User Register</h2>

        <p style="color:red;">{{ msg }}</p>

        <form action="{{ url_for('user_register') }}" method="POST">

            <input type="text"
                   name="u_n"
                   placeholder="Enter Username"
                   required
                   style="width:90%; padding:10px; margin:10px 0;">

            <input type="password"
                   name="pn"
                   placeholder="Enter Password"
                   required
                   style="width:90%; padding:10px; margin:10px 0;">

            <input type="text"
                   name="pf_n"
                   placeholder="Enter Profile Name"
                   required
                   style="width:90%; padding:10px; margin:10px 0;">

            <input type="email"
                   name="eml"
                   placeholder="Enter Email"
                   required
                   style="width:90%; padding:10px; margin:10px 0;">

            <button type="submit"
                    style="
                    width:95%;
                    padding:10px;
                    background:#1976d2;
                    color:white;
                    border:none;
                    border-radius:5px;
                    cursor:pointer;">
                Register
            </button>

        </form>

        <br>

        <a href="{{ url_for('user_login') }}"
           style="
           text-decoration:none;
           color:#1976d2;">
           Already have account? Login
        </a>

    </div>

</div>

{% endblock %}
